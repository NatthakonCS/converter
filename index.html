<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HighClass - เครื่องมือแปลงลิงก์ทีละเยอะๆ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-2">🛠 เครื่องมือแปลงลิงก์ Google Drive (Bulk Converter)</h1>
        <p class="text-gray-600 mb-6">วางชื่อสินค้าและลิงก์ Drive เดิมลงไป ระบบจะแปลงให้พร้อมก๊อปปี้ไปวางใน Google Sheets ทันที</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
            <div>
                <label class="block font-semibold mb-2 text-blue-600">1. ชื่อสินค้า (บรรทัดละ 1 ชื่อ)</label>
                <textarea id="input-names" class="w-full h-64 border border-gray-300 p-3 rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เสื้อ Polo Ralph Lauren&#10;แจ็คเก็ต Dickies"></textarea>
            </div>
            <div>
                <label class="block font-semibold mb-2 text-blue-600">2. ลิงก์ Google Drive เดิม (บรรทัดละ 1 ลิงก์)</label>
                <textarea id="input-links" class="w-full h-64 border border-gray-300 p-3 rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://drive.google.com/file/d/1AbCd.../view&#10;https://drive.google.com/file/d/2XyZ.../view"></textarea>
            </div>
        </div>

        <button onclick="convertLinks()" class="w-full bg-black text-white font-bold py-3 rounded hover:bg-gray-800 transition mb-6 shadow-lg">
            🔄 แปลงลิงก์ทั้งหมด
        </button>

        <div>
            <label class="block font-semibold mb-2 text-green-600">3. ผลลัพธ์ลิงก์ที่แปลงแล้ว (เอาไปวางคอลัมน์ image ใน Sheet)</label>
            <textarea id="output-result" class="w-full h-64 border border-gray-300 p-3 rounded bg-gray-50 outline-none" readonly placeholder="ลิงก์ที่พร้อมใช้งานจะแสดงตรงนี้..."></textarea>
            
            <button onclick="copyToClipboard()" class="mt-4 w-full md:w-auto bg-green-500 text-white font-bold px-6 py-3 rounded hover:bg-green-600 shadow-lg">
                📋 ก๊อปปี้ลิงก์ที่แปลงแล้วทั้งหมด
            </button>
        </div>
    </div>

    <script>
        function convertLinks() {
            const names = document.getElementById('input-names').value.split('\n');
            const links = document.getElementById('input-links').value.split('\n');
            let result = '';

            for(let i = 0; i < Math.max(names.length, links.length); i++) {
                let name = (names[i] || '').trim();
                let link = (links[i] || '').trim();
                let convertedLink = '';

                if(link) {
                    // ค้นหา ID จากลิงก์ Google Drive ทุกรูปแบบ
                    let match = link.match(/\/d\/([a-zA-Z0-9_-]+)/) || link.match(/id=([a-zA-Z0-9_-]+)/);
                    
                    if(match && match[1]) {
                        convertedLink = "https://drive.google.com/thumbnail?id=" + match[1] + "&sz=w1000";
                    } else {
                        convertedLink = "❌ ลิงก์ไม่ถูกต้อง";
                    }
                }

                // แสดงผลเฉพาะลิงก์ เพื่อให้เอาไปวางในคอลัมน์ image ได้เลยง่ายๆ
                // (ถ้ามีชื่อสินค้ามาด้วย จะแสดงกำกับไว้ให้ดูง่ายๆ)
                if(name && convertedLink) {
                    result += convertedLink + '\n'; 
                } else if (convertedLink) {
                    result += convertedLink + '\n';
                }
            }
            
            document.getElementById('output-result').value = result;
            
            if(result.trim() === '') {
                alert('กรุณาใส่ลิงก์ Google Drive ก่อนครับ');
            }
        }

        function copyToClipboard() {
            const output = document.getElementById('output-result');
            if(output.value.trim() === '') return;
            
            output.select();
            document.execCommand('copy');
            alert('ก๊อปปี้เรียบร้อย! เอาไปกดคลิกขวา -> วาง ในช่องแรกของคอลัมน์ image ใน Google Sheets ได้เลยครับ');
        }
    </script>
</body>
</html>
